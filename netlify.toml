[build]
  publish = "."

# Keep private working files off the public site.
# The files stay in GitHub and on the computer; visitors just get "not found".
[[redirects]]
  from = "/Portfolio/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Logo/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/INSTRUCTIONS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/VERSION"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Portfolio - Shortcut.lnk"
  to = "/404.html"
  status = 404
  force = true
